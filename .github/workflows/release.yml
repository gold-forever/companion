# A tag (v0.1.0) builds every file a player downloads (GoldForever-Companion.exe, GoldForever-Companion.dmg,
# the Linux binaries), writes SHA256SUMS, attests each file's build provenance (who built it, from which
# commit, with which workflow), and publishes a pre-release. VERIFY.md says how to
# check all three. Nothing here signs with a certificate: releases are unsigned by choice (design 006).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: make build VERSION=${{ github.ref_name }} DIST=dist
      - uses: actions/upload-artifact@v7
        with:
          name: portable
          path: dist/*

  # The .dmg holds the .app around one universal binary for Intel and Apple Silicon, built with cgo for
  # the tray. Its bytes depend on the runner's Xcode, which is printed so a rebuild can match it; the
  # bare binary is published too, so a Mac can compare it with the one inside the .app (VERIFY.md).
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: xcodebuild -version && go version
      - run: make macos VERSION=${{ github.ref_name }} DIST=dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  publish:
    needs: [portable, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- * | tee SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Publish a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}" --prerelease --generate-notes
          --title "${{ github.ref_name }}"
