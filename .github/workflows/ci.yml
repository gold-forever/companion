# Tests every push, and proves the build is reproducible: two runners of different architectures build
# every Windows and Linux binary, and the hashes must match byte for byte. macOS needs cgo for the tray,
# so only a Mac can build it: a third job does, so a break shows here and not first at a release.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: make build VERSION=ci DIST=out
      - run: cd out && sha256sum -- * > ../SHA256SUMS-${{ matrix.runner }}
      - uses: actions/upload-artifact@v7
        with:
          name: sums-${{ matrix.runner }}
          path: SHA256SUMS-${{ matrix.runner }}

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      # The release's .app and .dmg, built on every push so a tag is never their first build.
      - run: make macos VERSION=v0.0.0-ci DIST=out
      - name: The .dmg holds the .app with its menu-bar-only Info.plist
        run: |
          mount=$(hdiutil attach -nobrowse -readonly out/GoldForever-Companion.dmg | awk -F'\t' '/\/Volumes\//{print $NF}')
          app="$mount/Gold Forever Companion.app"
          plutil -lint "$app/Contents/Info.plist"
          test "$(plutil -extract LSUIElement raw "$app/Contents/Info.plist")" = true
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = com.evensberget.gold-forever-companion
          cmp "$app/Contents/MacOS/gold-forever-companion" out/gold-forever-companion-macos-universal
          lipo -archs "$app/Contents/MacOS/gold-forever-companion"
          hdiutil detach "$mount"

  reproducible:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sums-*
          merge-multiple: true
      - name: Both runners built the same bytes
        run: |
          cat SHA256SUMS-*
          diff SHA256SUMS-ubuntu-latest SHA256SUMS-ubuntu-24.04-arm
