# A copy of the Gold Forever server's companion spec, the one its contract test holds the server to.
# Copy a new version over this file, keeping this comment, and run `go generate ./internal/server`.
# Once released it changes only additively (see Compatibility below): a removal or rename is /api/v2.
openapi: 3.1.0
info:
  title: Gold Forever companion API
  version: "1"
  summary: Every request the Gold Forever companion makes to the site, and how the site answers.
  description: |
    The companion uploads the saves the game writes, links itself to a player's account, and writes the
    account's prices, dings switch and shared lists into the game. These are all the routes it calls.

    ## Compatibility

    Players update the companion rarely, so a released companion keeps calling these routes for months.
    Once released, this contract changes only additively: a new optional field in an answer, a new
    optional parameter, a new route. Removing or renaming a field, a parameter, a route or an answer's
    meaning, or making an optional field required, needs a new version path (`/api/v2`), and `/api/v1`
    keeps answering as described here while a released companion still calls it.

    A client should ignore a field it does not know: a later server may add one. This document lists
    every field today's server sends, so the server's own test fails on a field it leaves out.

    ## Authentication

    A route that needs a token takes it as `Authorization: Bearer <token>`. A player makes a token on
    the site, or the companion gets one by linking (`/api/v1/device/code`, then `/api/v1/device/token`).

    ## The site's former address

    The site moved to `https://gold-forever.app` from `https://gold-forever.evensberget.com`. The former
    address still serves these routes; any other path there answers a permanent redirect (308 for a
    request other than GET or HEAD) to the same path on `https://gold-forever.app`. A redirect to another
    host normally drops the `Authorization` header, so a client that follows one carries its token only
    to `https://gold-forever.app` over https, and to no other host.

    ## Answers

    A failure inside the server answers 500 with the error body (`{"status":"server error"}`), never
    what went wrong; a reverse proxy may answer other statuses while the site restarts. A client treats
    a 5xx, or a status not listed for a route, as "try again later".
servers:
  - url: https://gold-forever.app
security: []
paths:
  /api/v1/saves:
    post:
      operationId: uploadSave
      summary: Upload a save, byte for byte as the game wrote it
      description: |
        The game the save belongs to (WoW: Forever or retail) is read from the save's own `interface`
        number. Sending the same file twice is harmless: the server recognises it by its content and
        answers `already imported`. A save is at most 10 MiB for WoW: Forever and 32 MiB for retail.
      security:
        - bearer: []
      parameters:
        - name: name
          in: query
          required: false
          description: |
            Labels the upload in the player's list and the log; letters, digits and `-_.` are kept, at
            most 100. Left out, the upload is named `upload.lua`.
          schema:
            type: string
          example: GoldForever.lua
        - $ref: "#/components/parameters/UserAgent"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
              maxLength: 33554432
      responses:
        "200":
          description: The save is the server's now, imported or already held.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
              examples:
                imported:
                  value: {"status": "imported", "problems": 0, "saves": 12}
                alreadyImported:
                  value: {"status": "already imported", "saves": 12}
        "400":
          description: A save of a game the site does not know. Not worth sending again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadRefusal"
              example: {"status": "unknown game", "reason": "unknown game version 30403"}
        "401":
          description: No token, or a wrong or revoked one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadRefusal"
              example: {"status": "unauthorized"}
        "403":
          description: The account is suspended, or the token may not upload saves; `status` says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadRefusal"
              example: {"status": "this account is suspended; uploads are refused"}
        "413":
          description: |
            The save is over its game's limit, named in `reason`; past the 32 MiB transport limit there
            is no `reason`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadRefusal"
              example: {"status": "too large", "reason": "a forever save may be at most 10 MB"}
        "415":
          description: The body was not sent as `application/octet-stream`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadRefusal"
              example: {"status": "send the file as application/octet-stream"}
        "422":
          description: Not readable as a save.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadRefusal"
              example: {"status": "rejected", "reason": "not a GoldForever save"}
        "429":
          description: |
            Too many uploads from this account (`rate limited`), or too many at once on the server
            (`busy`, the import queue is full). Wait `Retry-After` seconds, then send it again.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadRefusal"
              examples:
                rateLimited:
                  value: {"status": "rate limited", "reason": "too many uploads from this account; try again in 40 s"}
                busy:
                  value: {"status": "busy", "reason": "too many uploads at once; try again shortly"}
        "503":
          description: Uploads are paused; `reason` is the operator's message. Wait at least `Retry-After` (600 s).
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadRefusal"
              example: {"status": "paused", "reason": "Back at 20:00."}

  /api/v1/prices:
    get:
      operationId: getPrices
      summary: The pooled prices of the account's markets, or of one market, in one game
      description: |
        Without `market`, every market of the token account's own characters in the game that has
        pooled prices, tagged as one. With `market`, that one market. Prices are integer copper, times
        epoch seconds. The `ETag` changes only when the prices do; sending it back in `If-None-Match`
        answers 304 while they are unchanged.
      security:
        - bearer: []
      parameters:
        - name: game
          in: query
          required: false
          description: The game; `forever` when left out. Any other value is a 400.
          schema:
            type: string
            enum: [forever, retail]
            default: forever
        - name: market
          in: query
          required: false
          description: One market's key, `<game>-<region>-<realm type>-<faction>`; 404 when the server prices no such market in the game.
          schema:
            $ref: "#/components/schemas/MarketKey"
          example: forever-EU-normal-horde
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/UserAgent"
      responses:
        "200":
          description: The prices; for one market when `market` was sent.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivate"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AccountPrices"
                  - $ref: "#/components/schemas/MarketPrices"
        "304":
          description: The prices are unchanged since the `If-None-Match` sent. No body.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivate"
        "400":
          description: An unknown `game`, or a `market` that is not a market key. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The server prices no such market in this game. No body.
        "503":
          description: The server is still loading its prices after a start; try again after `Retry-After` (15 s).
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: {"status": "prices loading"}

  /api/v1/dings/state:
    get:
      operationId: getDingsState
      summary: The site's side of the addon's "Announce dings on Discord" switch
      description: The same for every game of the account. Sending the `ETag` back in `If-None-Match` answers 304 while the state is unchanged.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/UserAgent"
      responses:
        "200":
          description: The account's dings state.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DingsState"
        "304":
          description: The state is unchanged since the `If-None-Match` sent. No body.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/shared/state:
    get:
      operationId: getSharedState
      summary: The account's shopping lists and sale profiles, to write into the game
      description: The same for every game of the account. Sending the `ETag` back in `If-None-Match` answers 304 while the set is unchanged.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/UserAgent"
      responses:
        "200":
          description: The account's lists and profiles.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedState"
        "304":
          description: The set is unchanged since the `If-None-Match` sent. No body.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/device/code:
    post:
      operationId: startDeviceLink
      summary: Ask for a code to link this computer to an account (RFC 8628, 3.1)
      description: |
        No token: linking is how the companion gets one. The player opens `verification_uri_complete`,
        signs in, checks `user_code` against the one the companion shows, and approves or denies it.
      parameters:
        - $ref: "#/components/parameters/UserAgent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCodeRequest"
      responses:
        "200":
          description: The code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCode"
        "400":
          description: No `hostname`, or one with nothing usable left in it, or a body that is not the request. No body.
        "503":
          description: Too many codes are waiting on the server; try again later. No body.

  /api/v1/device/token:
    post:
      operationId: pollDeviceToken
      summary: Ask whether the code was approved, and take the token once it is (RFC 8628, 3.4)
      description: Asked every `interval` seconds until the token comes, the code is denied, or it expires.
      parameters:
        - $ref: "#/components/parameters/UserAgent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceTokenRequest"
      responses:
        "200":
          description: Approved; the token, given once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceToken"
        "400":
          description: |
            Not approved: `authorization_pending` (not decided yet; ask again), `slow_down` (asked
            sooner than `interval`; add 5 seconds to it), `access_denied` (the player denied it; stop) or
            `expired_token` (past its 10 minutes, unknown, or already redeemed; stop).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceError"
              examples:
                pending:
                  value: {"error": "authorization_pending"}
                slowDown:
                  value: {"error": "slow_down"}
                denied:
                  value: {"error": "access_denied"}
                expired:
                  value: {"error": "expired_token"}

  /api/v1/companion/latest:
    get:
      operationId: getLatestCompanion
      summary: The newest companion release the site names
      description: Asked without a token, so it says nothing about who asks beyond the `User-Agent`.
      parameters:
        - $ref: "#/components/parameters/UserAgent"
      responses:
        "200":
          description: The newest release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "404":
          description: The site names no release. No body.

  /api/v1/companion/account:
    get:
      operationId: getCompanionAccount
      summary: Which account the token uploads to
      description: |
        The account's public name and BattleTag, so the companion can show its player which account it
        uploads to. Nothing else that would identify the account, and never another account's.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/UserAgent"
      responses:
        "200":
          description: The token account's public name and BattleTag.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
              examples:
                named:
                  value: {"publicName": "Goldsmith", "battleTag": "Goldsmith#1234"}
                unnamed:
                  value: {"publicName": null, "battleTag": "Goldsmith#1234"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A token from the site's token page, or from linking (`/api/v1/device/token`). Shown once; the server keeps only its hash.

  parameters:
    UserAgent:
      name: User-Agent
      in: header
      required: false
      description: The companion names itself `gold-forever-companion/<version> (<os>)`, so the server can tell its requests apart and show the version on the token.
      schema:
        type: string
      example: gold-forever-companion/0.1.0 (windows)
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: The `ETag` of the answer the client already holds.
      schema:
        type: string

  headers:
    ETag:
      required: true
      description: A quoted tag of this answer's content.
      schema:
        type: string
        pattern: '^"[^"]+"$'
    CacheControlPrivate:
      required: true
      description: The answer is the token account's own; a shared cache keeps none of it.
      schema:
        type: string
        const: private, no-cache
    RetryAfter:
      required: true
      description: How long to wait before asking again, in seconds.
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"

  responses:
    Unauthorized:
      description: No token, or a wrong or revoked one. No body.
    Forbidden:
      description: The account is suspended, or the token may not read prices. No body.

  schemas:
    Error:
      description: A failure's fixed word, never what went wrong inside.
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string

    ImportResult:
      type: object
      additionalProperties: false
      required: [status, saves]
      properties:
        status:
          type: string
          enum: [imported, already imported]
        problems:
          description: Rows of the save the import could not read; sent with `imported`.
          type: integer
          minimum: 0
        saves:
          description: How many saves the account has now.
          type: integer
          minimum: 0
        conflicts:
          description: Characters another account owns, left out of this upload; absent when none.
          type: array
          items:
            type: string

    UploadRefusal:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          description: What happened, in a few words; on a 403 and a 415 the whole explanation.
          type: string
        reason:
          description: Why, in words a player can read; absent when `status` says it.
          type: string

    MarketKey:
      type: string
      pattern: "^[A-Za-z0-9_-]+$"

    Copper:
      type: integer
      minimum: 0
      maximum: 9007199254740991

    EpochSeconds:
      type: integer
      minimum: 0
      maximum: 9007199254740991

    ItemPrice:
      type: object
      additionalProperties: false
      required: [id, value, minBuyout, players, scannedAt]
      properties:
        id:
          description: The item's id.
          type: integer
          minimum: 1
        value:
          description: The item's pooled market value.
          $ref: "#/components/schemas/Copper"
        minBuyout:
          description: The lowest buyout in the newest pooled scan.
          $ref: "#/components/schemas/Copper"
        players:
          description: How many players' scans the figures rest on.
          type: integer
          minimum: 0
        scannedAt:
          description: When the newest pooled figure was scanned.
          $ref: "#/components/schemas/EpochSeconds"
        week:
          description: The median of the item's daily pooled values over the 7 days before `scannedAt`'s; absent with too little history.
          type: integer
          minimum: 1
          maximum: 9007199254740991
        units:
          description: |
            The units on sale in the item's newest pooled scan, only when the price is thin: it rests on so few units
            (5 or fewer today) that one listing can move it. Absent otherwise; a companion that does not know it ignores it.
          type: integer
          minimum: 0

    AccountPrices:
      description: Every market of the token account's characters in the game that has pooled prices.
      type: object
      additionalProperties: false
      required: [v, game, at, markets]
      properties:
        v:
          const: 1
        game:
          type: string
          enum: [forever, retail]
        at:
          description: When the answer was made.
          $ref: "#/components/schemas/EpochSeconds"
        markets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [market, items]
            properties:
              market:
                $ref: "#/components/schemas/MarketKey"
              items:
                type: array
                items:
                  $ref: "#/components/schemas/ItemPrice"

    MarketPrices:
      description: One market's prices, when `market` was sent.
      type: object
      additionalProperties: false
      required: [v, game, market, at, items]
      properties:
        v:
          const: 1
        game:
          type: string
          enum: [forever, retail]
        market:
          $ref: "#/components/schemas/MarketKey"
        at:
          description: When the answer was made.
          $ref: "#/components/schemas/EpochSeconds"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemPrice"

    DingsState:
      type: object
      additionalProperties: false
      required: [v, at, webhook, characters]
      properties:
        v:
          const: 1
        at:
          description: When the state last changed; 0 when it never has.
          $ref: "#/components/schemas/EpochSeconds"
        webhook:
          description: Whether a Discord webhook that posts level-ups is connected.
          type: boolean
        characters:
          description: Each character's choice, by its GUID.
          type: object
          propertyNames:
            pattern: "^Player-[0-9]+-[0-9A-Fa-f]+$"
          additionalProperties:
            type: boolean

    SharedString:
      type: object
      additionalProperties: false
      required: [id, edited, string]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
        edited:
          description: When it was last edited.
          $ref: "#/components/schemas/EpochSeconds"
        string:
          description: The list or profile as the addon's import string, `GFL1:` or `GFP1:` and printable ASCII.
          type: string

    SharedState:
      type: object
      additionalProperties: false
      required: [v, at, lists, profiles]
      properties:
        v:
          const: 1
        at:
          description: When the account's set last changed; 0 when it never has.
          $ref: "#/components/schemas/EpochSeconds"
        lists:
          type: array
          maxItems: 50
          items:
            allOf:
              - $ref: "#/components/schemas/SharedString"
              - properties:
                  string:
                    pattern: "^GFL1:[ -~]*$"
        profiles:
          type: array
          maxItems: 50
          items:
            allOf:
              - $ref: "#/components/schemas/SharedString"
              - properties:
                  string:
                    pattern: "^GFP1:[ -~]*$"

    DeviceCodeRequest:
      type: object
      additionalProperties: false
      required: [hostname]
      properties:
        client:
          description: The app's name; `companion` when left out.
          type: string
          example: gold-forever-companion
        hostname:
          description: |
            Names the token the player approves ("Companion on <hostname>"). Letters, digits, spaces and
            `-_.` are kept, at most 50; the companion sends `this computer` when the computer has no name.
          type: string

    DeviceCode:
      type: object
      additionalProperties: false
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
      properties:
        device_code:
          description: The app's secret for polling; never shown.
          type: string
        user_code:
          description: What the player checks on the site.
          type: string
          pattern: "^[A-Z0-9]{4}-[A-Z0-9]{4}$"
          example: BCDF-GHJK
        verification_uri:
          description: The site's page where the player decides the code.
          type: string
          format: uri
        verification_uri_complete:
          description: That page with the code filled in.
          type: string
          format: uri
        expires_in:
          description: Seconds the code lives (600).
          type: integer
          minimum: 1
        interval:
          description: Seconds between polls (5).
          type: integer
          minimum: 1

    DeviceTokenRequest:
      type: object
      additionalProperties: false
      required: [device_code]
      properties:
        device_code:
          type: string

    DeviceToken:
      type: object
      additionalProperties: false
      required: [access_token, token_type, scope]
      properties:
        access_token:
          description: "The token, given once; send it as `Authorization: Bearer <token>`."
          type: string
          pattern: "^gf_[0-9A-Za-z]+$"
        token_type:
          const: Bearer
        scope:
          const: saves:write prices:read

    DeviceError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [authorization_pending, slow_down, access_denied, expired_token]

    Account:
      type: object
      additionalProperties: false
      required: [publicName]
      properties:
        publicName:
          description: The name the player chose to be shown by; null while they have chosen none.
          type: [string, "null"]
        battleTag:
          description: |
            The BattleTag of the account's first login, as the site's Settings page lists it; null when it has
            none. Optional: a server before it answers without it. For the companion to show its own player only.
          type: [string, "null"]

    Release:
      type: object
      additionalProperties: false
      required: [version, url]
      properties:
        version:
          type: string
          example: v0.1.0
        url:
          description: The release's page; the companion shows a notice only for one of its own GitHub releases or a page of the site.
          type: string
          format: uri
